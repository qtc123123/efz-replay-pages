name: Deploy EFZ replay player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify and unpack the site
        shell: bash
        run: |
          set -euo pipefail
          parts=(replay-site.zip.part-{000..008} replay-site.zip.part-009-{0..1} replay-site.zip.part-010)
          actual_parts=(replay-site.zip.part-*)
          test "${#actual_parts[@]}" -eq 12
          printf '%s\n' "${parts[@]}" | diff - <(printf '%s\n' "${actual_parts[@]}")
          printf '%s\n' "${parts[@]}" | diff - <(awk '{print $2}' "$GITHUB_WORKSPACE/parts-sha256.txt")
          for part in "${parts[@]}"; do
            test -f "$part" && test ! -L "$part"
            test "$(stat -c%s "$part")" -le 20971520
          done
          sha256sum --strict --check "$GITHUB_WORKSPACE/parts-sha256.txt"
          test ! -e "$RUNNER_TEMP/replay-site.zip" && test ! -L "$RUNNER_TEMP/replay-site.zip"
          cat "${parts[@]}" > "$RUNNER_TEMP/replay-site.zip"
          python3 "$GITHUB_WORKSPACE/tools/test-verify-site.py"
          python3 "$GITHUB_WORKSPACE/tools/verify-site.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload the verified static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/replay-pages-site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
