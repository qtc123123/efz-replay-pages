name: Deploy replay player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the deployment package
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify and extract the reviewed static package
        shell: bash
        run: |
          sha256sum --strict --check replay-site.zip.sha256
          unzip -q replay-site.zip -d "$RUNNER_TEMP/replay-pages-site"
          cd "$RUNNER_TEMP/replay-pages-site"
          sha256sum --strict --check "$GITHUB_WORKSPACE/site-sha256.txt"
          test "$(find . -type f | wc -l)" -eq 28
          test "$(find . -type l | wc -l)" -eq 0
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload the static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/replay-pages-site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
