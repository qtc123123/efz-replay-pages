name: Deploy replay player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the deployment package
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify and extract the reviewed static package
        shell: bash
        run: |
          set -euo pipefail
          parts=(replay-site.zip.part-{000..008})
          actual_parts=(replay-site.zip.part-*)
          test "${#actual_parts[@]}" -eq 9
          printf '%s\n' "${parts[@]}" | diff - <(awk '{print $2}' parts-sha256.txt)
          sha256sum --strict --check parts-sha256.txt
          cat "${parts[@]}" > "$RUNNER_TEMP/replay-site.zip"
          cd "$RUNNER_TEMP"
          sha256sum --strict --check "$GITHUB_WORKSPACE/replay-site.zip.sha256"
          python3 - "$RUNNER_TEMP/replay-site.zip" "$GITHUB_WORKSPACE/site-sha256.txt" <<'ZIP_CHECK'
          import pathlib, stat, sys, zipfile
          expected = [line.rstrip('\n')[66:] for line in open(sys.argv[2])]
          assert len(expected) == len(set(expected)) == 197
          with zipfile.ZipFile(sys.argv[1]) as archive:
              members = archive.infolist()
              names = [member.filename for member in members]
              assert len(names) == len(set(names)) == 197 and set(names) == set(expected)
              for member in members:
                  path = pathlib.PurePosixPath(member.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.filename
                  assert not member.is_dir() and stat.S_ISREG(member.external_attr >> 16)
          ZIP_CHECK
          unzip -q "$RUNNER_TEMP/replay-site.zip" -d "$RUNNER_TEMP/replay-pages-site"
          cd "$RUNNER_TEMP/replay-pages-site"
          sha256sum --strict --check "$GITHUB_WORKSPACE/site-sha256.txt"
          test "$(find . -type f | wc -l)" -eq 197
          test "$(find . -type l | wc -l)" -eq 0
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload the static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/replay-pages-site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
